name: Continuous Integration
on: [push, pull_request]

jobs:
  buildandtest:
    # Python 3.15 is a prerelease; report failures without blocking releases.
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest, windows-latest, macos-latest]
        backend: [platform-default]
        exclude:
          # Older Python versions do not have hosted macOS ARM64 builds.
          - os: macos-latest
            python-version: "3.8"
          - os: macos-latest
            python-version: "3.9"
        include:
          - os: macos-15-intel
            python-version: "3.8"
          - os: macos-15-intel
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.12"
            backend: python
          - os: macos-latest
            python-version: "3.12"
            backend: python
    runs-on: ${{ matrix.os }}
    name: >-
      ${{ matrix.os }} / Python ${{ matrix.python-version }} /
      ${{ (matrix.backend == 'python' || matrix.os == 'windows-latest') && 'python' || 'cpp' }}
      ${{ matrix.python-version == '3.15' && '(experimental)' || '' }}
    env:
      TORCHTT_NO_CPP: ${{ (matrix.backend == 'python' || matrix.os == 'windows-latest') && '1' || '0' }}
      MAX_JOBS: "2"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.python-version == '3.15' }}
      - name: Install Linux compiler and system headers
        if: runner.os == 'Linux' && env.TORCHTT_NO_CPP != '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev
          echo "CXX=g++" >> "$GITHUB_ENV"
          g++ --version
      - name: Configure macOS compiler and SDK
        if: runner.os == 'macOS' && env.TORCHTT_NO_CPP != '1'
        run: |
          # GitHub's macOS runners already include Xcode Command Line Tools.
          xcode-select -p
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export CXX="$(xcrun --sdk macosx --find clang++)"
          echo "SDKROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-isysroot $SDKROOT" >> "$GITHUB_ENV"
          # Python may be universal2, but the installed PyTorch is single-arch.
          echo "ARCHFLAGS=-arch $(python -c 'import platform; print(platform.machine())')" >> "$GITHUB_ENV"
          "$CXX" --version
          printf '#include <cassert>\n#include <functional>\n' | \
            "$CXX" -isysroot "$SDKROOT" -std=c++17 -x c++ -fsyntax-only -
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install CPU-only PyTorch
        # Python 3.15 wheels are available here before PyPI, also for macOS.
        if: runner.os != 'macOS' || matrix.python-version == '3.15'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install runtime, test, and build dependencies
        # --no-build-isolation requires us to satisfy pyproject.toml's build
        # requirements; an unversioned install can retain setuptools 56.
        run: >-
          python -m pip install -r requirements.txt
          "setuptools>=61" "setuptools-scm>=8.0" wheel ninja
          "tomli; python_version < '3.11'"
      - name: Use NumPy compatible with older PyTorch wheels
        if: matrix.python-version == '3.8' || matrix.python-version == '3.9'
        run: python -m pip install "numpy<2"
      - name: Show installed dependencies
        run: python -m pip list
      - name: Install torchTT against the runtime PyTorch
        run: python -m pip install --no-build-isolation -v .
      - name: Verify installed version and backend
        working-directory: ${{ runner.temp }}
        shell: python
        run: |
          import os
          from importlib.metadata import version
          from pathlib import Path
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib

          config = Path(os.environ["GITHUB_WORKSPACE"]) / "pyproject.toml"
          expected_version = tomllib.loads(config.read_text(encoding="utf-8"))["project"]["version"]
          installed_version = version("torchTT")
          print(f"Installed torchTT {installed_version}; expected {expected_version}")
          assert installed_version == expected_version, (installed_version, expected_version)

          import torchtt
          expected_cpp = os.environ["TORCHTT_NO_CPP"] != "1"
          if expected_cpp:
              import torchttcpp  # Surface loader errors instead of silently falling back.
          assert torchtt.cpp_enabled() == expected_cpp
          assert torchtt.solvers.cpp_enabled() == expected_cpp
      - name: Run tests
        # Exercise the installed wheel instead of importing the source checkout.
        working-directory: ${{ runner.temp }}
        # Keep crash reporting enabled after pytest tears down its own handler.
        run: python -X faulthandler -m pytest "${{ github.workspace }}/tests/"
