name: Publish torchTT to pypi

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types:
      - completed

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    # Only build for a pushed release tag. `workflow_run.head_branch` carries
    # the tag name for a tag push.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && startsWith(github.event.workflow_run.head_branch, 'v')

    steps:
    - uses: actions/checkout@v4
      with:
        # A workflow_run job checks out the default branch by default, which
        # would package main's tip rather than the commit that was tagged.
        ref: ${{ github.event.workflow_run.head_sha }}
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build --sdist
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: >-
      Publish to PyPI
    # Only publish when triggered by a version tag (e.g., v1.0.0)
    if: startsWith(github.event.workflow_run.head_branch, 'v') && github.event.workflow_run.event == 'push'
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/torchTT  # Replace <package-name> with your PyPI project name
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: >-
      Sign the Python distribution with Sigstore
      and upload them to GitHub Release
    needs:
    - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@v3.0.0
      with:
        inputs: >-
          ./dist/*.tar.gz
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        RELEASE_REPOSITORY: ${{ github.repository }}
      run: |
        printf 'Documentation: https://ion-g-ion.github.io/torchTT/%s/\n' "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
        gh release create "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" \
          --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
    - name: Upload artifact signatures to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      # Upload to GitHub Release using the `gh` CLI.
      # `dist/` contains the built packages, and the
      # sigstore-produced signatures and certificates.
      run: >-
        gh release upload
        '${{ github.event.workflow_run.head_branch }}' dist/**
        --repo '${{ github.repository }}'


  documentation:
    needs: github-release
    permissions:
      contents: write
      pages: write
      id-token: write
    # Calling explicitly works for releases created with GITHUB_TOKEN, which
    # do not trigger another workflow through release: published.
    uses: ./.github/workflows/docs-build.yml
    with:
      version: ${{ github.event.workflow_run.head_branch }}
