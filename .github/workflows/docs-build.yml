name: Build and publish documentation

on:
  workflow_call:
    inputs:
      version:
        description: "latest or a published release tag"
        required: true
        type: string
      source-sha:
        description: "The tested main commit; empty for a manual build or a release"
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      stable-eligible: ${{ steps.resolve.outputs.stable-eligible }}
    steps:
      - name: Check out current build tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - name: Resolve the documentation source
        id: resolve
        uses: actions/github-script@v8
        env:
          DOC_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        with:
          script: |
            const version = process.env.DOC_VERSION;
            const sha = process.env.SOURCE_SHA;
            if (version === 'latest') {
              if (sha && !/^[0-9a-f]{40}$/.test(sha)) throw new Error('Invalid source SHA');
              core.setOutput('ref', sha || 'refs/heads/main');
              core.setOutput('stable-eligible', 'false');
            } else {
              if (sha || !/^v\d+\.\d+(?:\.\d+)?(?:(?:a|b|rc)\d+)?$/.test(version)) {
                throw new Error('Expected latest or a version tag such as v0.5.0');
              }
              const {data: release} = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag: version
              });
              if (release.draft) throw new Error('Draft releases cannot be published as documentation');
              core.setOutput('ref', `refs/tags/${version}`);
              core.setOutput('stable-eligible', String(!release.prerelease));
            }
      - name: Check out the exact source version
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.ref }}
          path: source
          persist-credentials: false
      - name: Record source commit
        id: source
        run: echo "sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tooling/docs/requirements.txt
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Install CPU-only PyTorch
        run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install documentation dependencies
        run: python -m pip install -r tooling/docs/requirements.txt
      - name: Build Sphinx against the source tree
        env:
          DOC_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python tooling/scripts/build_docs.py \
            --source "$GITHUB_WORKSPACE/source" \
            --output "$RUNNER_TEMP/docs-html" \
            --channel "$DOC_VERSION" --sha "$SOURCE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: ${{ runner.temp }}/docs-html
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Lock the entire read/modify/save/deploy transaction. Queue releases rather
    # than allowing another pending main build to cancel them.
    concurrency:
      group: documentation-site
      queue: max
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install packaging==25.0
      - uses: actions/download-artifact@v4
        with:
          name: docs-html
          path: ${{ runner.temp }}/docs-html
      - name: Load the saved site and reject obsolete main builds
        id: archive
        env:
          DOC_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          git -C tooling fetch origin refs/heads/main:refs/remotes/origin/main
          if [[ "$DOC_VERSION" == latest && "$SOURCE_SHA" != "$(git -C tooling rev-parse refs/remotes/origin/main)" ]]; then
            echo "A newer main commit exists; leaving latest unchanged."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          site_ref=$(git -C tooling ls-remote --heads origin refs/heads/docs-site)
          if [[ -n "$site_ref" ]]; then
            git -C tooling fetch origin refs/heads/docs-site:refs/remotes/origin/docs-site
            git -C tooling worktree add --detach "$RUNNER_TEMP/docs-site" refs/remotes/origin/docs-site
          else
            git -C tooling worktree add --detach "$RUNNER_TEMP/docs-site" HEAD
            git -C "$RUNNER_TEMP/docs-site" switch --orphan docs-site
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Preserve versions and save the complete site
        if: steps.archive.outputs.publish == 'true'
        env:
          DOC_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ needs.build.outputs.sha }}
          STABLE_ELIGIBLE: ${{ needs.build.outputs.stable-eligible }}
        run: |
          set -euo pipefail
          args=(--channel latest)
          if [[ "$DOC_VERSION" != latest ]]; then
            args=(--channel release --tag "$DOC_VERSION")
            if [[ "$STABLE_ELIGIBLE" == true ]]; then args+=(--stable-eligible); fi
          fi
          python tooling/scripts/docs_site.py \
            --site "$RUNNER_TEMP/docs-site" --html "$RUNNER_TEMP/docs-html" \
            --sha "$SOURCE_SHA" "${args[@]}"
          git -C "$RUNNER_TEMP/docs-site" config user.name 'github-actions[bot]'
          git -C "$RUNNER_TEMP/docs-site" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$RUNNER_TEMP/docs-site" add --all
          if ! git -C "$RUNNER_TEMP/docs-site" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/docs-site" commit -m "Publish documentation for $DOC_VERSION (${SOURCE_SHA:0:7})"
            git -C "$RUNNER_TEMP/docs-site" push origin HEAD:refs/heads/docs-site
          fi
      - uses: actions/upload-pages-artifact@v4
        if: steps.archive.outputs.publish == 'true'
        with:
          path: ${{ runner.temp }}/docs-site
      - name: Deploy the complete documentation site
        id: deploy
        if: steps.archive.outputs.publish == 'true'
        uses: actions/deploy-pages@v4
